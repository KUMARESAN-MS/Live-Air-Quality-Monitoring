<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real-Time AQI Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live Air Quality Index monitoring dashboard with real-time AQI data, AI insights, and health advisories for cities worldwide.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌫️</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ── Top App Bar ─────────────────────────────────────────── -->
  <header class="app-bar">
    <div class="logo">
      <span class="logo-icon">🌫️</span>
      <h1>AQI Monitor</h1>
      <span class="conn-dot" id="connStatus" title="Connection status"></span>
    </div>
    
    <!-- Tab Navigation -->
    <nav class="app-nav" aria-label="Main navigation">
      <button class="tab-btn active" data-target="dashboardTab">Dashboard</button>
      <button class="tab-btn" data-target="insightsTab" id="navInsights">Insights</button>
    </nav>

    <div class="app-controls">
      <button class="city-picker-btn" id="openCityPicker" aria-label="Select cities to monitor">🌍 <span>Change Cities</span></button>

      <select id="globalCitySelector" class="city-dropdown" style="display: none;" aria-label="Select city for insights">
        <!-- populated by JS only when in Insights Tab -->
      </select>
      
      <div class="mode-toggle">
        <span class="mode-label">Demo</span>
        <label class="switch" aria-label="Toggle demo mode">
          <input type="checkbox" id="demoToggle">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
  </header>

  <main class="app-content">
    
    <!-- ── TAB 1: OVERVIEW DASHBOARD (Cards Grid) ──────────────── -->
    <section id="dashboardTab" class="tab-content active">
      <div class="cards-grid" id="cityCardsContainer">
        <div class="loader">
          <div class="spinner"></div>
          <p style="margin-top: 1rem; color: var(--text-secondary);">Connecting to data stream…</p>
        </div>
      </div>
    </section>

    <!-- ── TAB 2: DETAILED INSIGHTS (Single City) ──────────────── -->
    <section id="insightsTab" class="tab-content">
      
      <!-- Graph Card (Hero Section) -->
      <div class="hero-card">
        <div class="hero-header">
           <div class="hero-aqi">
             <span class="aqi-label">AQI</span>
             <span id="heroAqiValue" class="aqi-num">--</span>
             <span id="heroTrend" class="trend-icon">→</span>
           </div>
           <div class="hero-meta">
             <span id="heroCategory" class="category-badge">Loading…</span>
             <span class="timestamp" id="heroTime">--:--</span>
           </div>
        </div>
        <div class="chart-container">
          <canvas id="aqiChart"></canvas>
        </div>
      </div>

      <!-- 4-Card Intelligence Grid -->
      <div class="intel-grid">
        
        <div class="intel-card" id="cardInsight">
          <div class="card-icon">🧠</div>
          <div class="card-content">
            <h4>AI Insight</h4>
            <p id="insightText">Waiting for data…</p>
          </div>
        </div>

        <div class="intel-card" id="cardAlerts">
          <div class="card-icon">🚨</div>
          <div class="card-content">
            <h4>Alert Status</h4>
            <p id="alertText">No active alerts</p>
          </div>
        </div>

        <div class="intel-card" id="cardPrediction">
          <div class="card-icon">📈</div>
          <div class="card-content">
            <h4>Next Hour Pattern</h4>
            <p><span id="predValue" class="focus-text">--</span> <span id="predLabel" class="sub-text"></span></p>
          </div>
        </div>

        <div class="intel-card" id="cardTraffic">
          <div class="card-icon">🚗</div>
          <div class="card-content">
            <h4>Traffic Impact</h4>
            <div style="display: flex; gap: 8px; align-items: center; margin-top: 6px;">
              <div id="trafficIndicator" class="traffic-dot">—</div>
              <p id="trafficText" class="focus-text">—</p>
            </div>
          </div>
        </div>

        <div class="intel-card full-width" id="cardAdvisory">
          <div class="card-icon" style="background: rgba(239, 68, 68, 0.08);">❤️</div>
          <div class="card-content">
            <h4>Health Advisory</h4>
            <p id="healthText" style="color: var(--text-primary); font-size: 0.88rem;">—</p>
          </div>
        </div>
        
      </div>
    </section>
  </main>

  <!-- ── City Picker Modal ────────────────────────────────── -->
  <div class="modal-overlay" id="cityPickerModal" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2>🌍 Select Cities</h2>
        <span class="modal-counter" id="cityCounter">0/8</span>
      </div>
      <input type="text" class="modal-search" id="citySearch" placeholder="Search cities…" autocomplete="off">
      
      <!-- Custom Coordinate Form -->
      <div class="custom-coord-form">
        <p class="custom-coord-title">Or add a custom location</p>
        <div class="custom-coord-inputs">
          <input type="number" id="customLat" placeholder="Latitude (e.g., 40.71)" step="0.01">
          <input type="number" id="customLon" placeholder="Longitude (e.g., -74.00)" step="0.01">
          <button id="addCustomCityBtn" class="modal-btn primary">Add</button>
        </div>
        <p id="customCoordMsg" class="custom-coord-msg"></p>
      </div>

      <div class="modal-body" id="cityListContainer">
        <!-- populated by JS -->
      </div>
      <div class="modal-footer">
        <button class="modal-btn secondary" id="citySelectAll">Select All</button>
        <button class="modal-btn secondary" id="cityClearAll">Clear All</button>
        <button class="modal-btn primary" id="cityApply">Apply</button>
        <button class="modal-btn ghost" id="cityCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ── Toast Notification Container ───────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/static/dashboard.js"></script>
</body>
</html>
